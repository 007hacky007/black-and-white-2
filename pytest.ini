[pytest]
testpaths = tests
markers =
    gamefiles: needs the user's real discs and patches (run with BW2_GAMEFILES=1)
    long: a long run (up to 30 minutes; run with BW2_LONG=1, on top of BW2_GAMEFILES=1)
    builder_e2e: the whole Builder build from the discs and patches (run with BW2_BUILDER_E2E=1, on top of BW2_GAMEFILES=1)
