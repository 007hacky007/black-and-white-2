name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the Builder to (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  builder:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the tag matches VERSION
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(cat VERSION)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match VERSION $VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt dmgbuild==1.6.7

      - name: Test the Builder's Swift core
        run: swift test --package-path builder

      - name: Make BW2 Builder.app
        run: python -m bw2.make_builder --out out

      - name: Build the disk image
        run: |
          dmgbuild -s builder/dmg/settings.py -D app="out/BW2 Builder.app" "BW2 Builder ${{ steps.ver.outputs.version }}" out/BW2-Builder.dmg
          (cd out && shasum -a 256 BW2-Builder.dmg > BW2-Builder.dmg.sha256)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f .github/release-notes.md ]; then
              gh release create "$TAG" --verify-tag --title "BW2 Builder ${{ steps.ver.outputs.version }}" --notes-file .github/release-notes.md --prerelease
            else
              gh release create "$TAG" --verify-tag --title "BW2 Builder ${{ steps.ver.outputs.version }}" --generate-notes --prerelease
            fi
          fi
          gh release upload "$TAG" out/BW2-Builder.dmg out/BW2-Builder.dmg.sha256 --clobber
